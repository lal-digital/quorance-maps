<text x="40" y="1112" fill="#8a97a8" font-size="12">How to read it: signals arrive on the DENDRITES (left, magenta = the one AI/perception step). The afferent that feeds them is now a GRADED, ADAPTING sensory neuron (Q P110): a constant platform signal fades, a changed one arrives at full strength. The SOMA is now STATEFUL (Q P109) — it carries a membrane potential with leak + a refractory window, so it has memory between inputs. The AXON carries the verdict out (right, myelin = the insulated wire). INHIB is the veto that can stop a fire. Biological parts only.</text>
