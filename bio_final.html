<text x="40" y="64" fill="#cdd6e4" font-size="14"><tspan font-weight="700">Plain version:</tspan> the CSM brain reads each account from its platforms, checks the facts, decides VERIFIED / BLOCKED / CONTINGENT, and then waits for a human to approve any write. Below, each region is a real neuron: signal enters at the DENDRITES (left), the SOMA integrates, and the verdict travels out the AXON (right).</text>
<text x="40" y="92" fill="#8a97a8" font-size="12">One real account (A1 American Fence::0016g00000KkW1PAAV) flows as a signal: sense - integrate - fire - inhibit - store - veto. * = part wired into the brain today. Each cell is rotated so its axon points at the region it feeds next.</text>
